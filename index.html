<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  
  <main>
    <section class="img-section">
      <picture>
        <source media="(max-width: 500px)" srcset="images/image-product-mobile.jpg">
      <img src="images/image-product-desktop.jpg" alt="product-image">
      </picture>
    </section>
    <section class="product-details">
      <div class="product-name">
        <span>Perfume</span>
        <h3>Gabrielle<br>Essence Eau<br>De Parfum</h3>
        <p>
          A floral, solar and voluptuous<br>
          interpretation composed by<br>
          Olivier Polge, Perfume-Creator<br>
          for the House of CHANEL.
        </p>
      </div>
      <div class="price-row">
        <p>$149.99</p>
        <span>%169.99</span>
      </div>
      <div class="btn">
        <button>
          <img src="images/icon-cart.svg" alt="cart-icon"> Add to Cart
        </button>
      </div>
    </section>  
  </main>

</body>
</html>
